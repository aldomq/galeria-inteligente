<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Galería Inteligente</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🖼️%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <a class="info-icon" href="connect.html" title="Reconectar carpeta de Drive">i</a>

  <header>
    <h1>Galería Inteligente</h1>
    <div class="search-wrap">
      <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input id="search" type="text" placeholder="Buscar (ej. montura negra con bordado)…" autocomplete="off" />
    </div>
    <button type="button" id="pending-filter-btn" class="pending-btn">⚠️ Ver pendientes de etiquetar</button>
    <a class="nav-link" href="etiquetas.html">Gestionar etiquetas →</a>
  </header>

  <div id="tag-cloud" class="tag-cloud"></div>

  <main id="gallery" class="gallery">
    <p class="loading">Cargando fotos…</p>
  </main>

  <div id="photo-modal" class="modal-overlay" hidden>
    <div class="modal">
      <button type="button" class="modal-close" data-action="close-modal">✕</button>
      <img id="modal-image" src="" alt="" />
      <input id="modal-name-input" type="text" placeholder="Nombre de la foto" />
      <div id="modal-tags" class="tags"></div>
      <div id="modal-add-tag-row" class="add-tag">
        <select id="modal-tag-select"></select>
        <button type="button" id="modal-add-tag-btn">+</button>
      </div>
      <button type="button" id="modal-save-btn" class="save-btn">Guardar cambios</button>
    </div>
  </div>

  <footer class="watermark">Hecho por Aldo Mora</footer>

  <script src="app.js?v=2"></script>
</body>
</html>
